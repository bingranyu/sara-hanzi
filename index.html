<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>森林拆字守護者</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #e8f5e9;
            color: #2e7d32;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { color: #1b5e20; }
        .instruction { margin-bottom: 20px; font-size: 1.2rem; }
        
        /* 遊戲區域 */
        #game-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            text-align: center;
        }

        /* 題目顯示區 */
        .word-display {
            font-size: 80px;
            margin: 20px;
            padding: 20px;
            border: 4px dashed #a5d6a7;
            border-radius: 15px;
            min-height: 120px;
        }

        /* 選項區 */
        .options-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .option-btn {
            font-size: 30px;
            padding: 15px 25px;
            background-color: #ffffff;
            border: 2px solid #81c784;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background-color: #f1f8e9;
            transform: scale(1.05);
        }

        .correct { background-color: #81c784 !important; color: white; }
        
        #message {
            margin-top: 20px;
            font-size: 24px;
            height: 30px;
            font-weight: bold;
        }

        button#next-btn {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 20px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

    <h1>森林拆字守護者 🌳</h1>
    <p class="instruction">點擊下方正確的部件，幫「字寶寶」找回它的零件吧！</p>

    <div id="game-container">
        <div id="target-word" style="font-size: 24px; color: #666;">目標國字：<span id="current-full-word">?</span></div>
        <div class="word-display" id="display-area">?</div>
        
        <div class="options-container" id="options">
            <!-- 按鈕會由 JS 產生 -->
        </div>

        <div id="message"></div>
        <button id="next-btn" onclick="nextLevel()">下一個關卡</button>
    </div>

    <script>
        // 設定題目：國字與對應的部件
        const quizData = [
            { word: "築", parts: ["竹", "木", "凡", "凡"] },
            { word: "惱", parts: ["忄", "腦"] },
            { word: "魔", parts: ["麻", "鬼"] },
            { word: "舒", parts: ["舍", "予"] },
            { word: "瓣", parts: ["辛", "瓜", "辛"] },
            { word: "匠", parts: ["匚", "斤"] },
            { word: "桐", parts: ["木", "同"] },
            { word: "爬", parts: ["爪", "巴"] }
        ];

        let currentIdx = 0;
        let foundParts = [];

        function initLevel() {
            const data = quizData[currentIdx];
            document.getElementById('current-full-word').innerText = data.word;
            document.getElementById('display-area').innerText = "";
            document.getElementById('message').innerText = "";
            document.getElementById('next-btn').style.display = "none";
            foundParts = [];
            
            // 產生選項（包含正確與干擾項）
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = "";
            
            // 混合所有部件作為選項
            let allOptions = [...data.parts, "手", "口", "日", "水", "心"];
            allOptions = allOptions.sort(() => Math.random() - 0.5);

            allOptions.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = p;
                btn.onclick = () => checkPart(p, btn);
                optionsDiv.appendChild(btn);
            });
        }

        function checkPart(p, btn) {
            const data = quizData[currentIdx];
            // 檢查點擊的部件是否在正確清單中，且尚未被找齊次數
            const targetCount = data.parts.filter(x => x === p).length;
            const currentCount = foundParts.filter(x => x === p).length;

            if (data.parts.includes(p) && currentCount < targetCount) {
                foundParts.push(p);
                btn.classList.add('correct');
                document.getElementById('display-area').innerText = foundParts.join(" + ");
                
                if (foundParts.length === data.parts.length) {
                    document.getElementById('message').innerText = "太棒了！守護成功！✨";
                    document.getElementById('next-btn').style.display = "inline-block";
                }
            } else {
                document.getElementById('message').innerText = "再試試看喔，你可以的！🌱";
                setTimeout(() => { document.getElementById('message').innerText = ""; }, 1500);
            }
        }

        function nextLevel() {
            currentIdx = (currentIdx + 1) % quizData.length;
            initLevel();
        }

        // 啟動第一關
        initLevel();
    </script>
</body>
</html>
