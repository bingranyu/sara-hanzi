<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>森林拆字守護者</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --forest-green: #2e7d32;
            --light-forest: #e8f5e9;
        }

        body {
			background-color: var(--light-forest);
			font-family: "Microsoft JhengHei", sans-serif;
			min-height: 100vh;
			display: flex;
			flex-direction: column; /* 確保內容由上而下排列 */
			align-items: center;
			justify-content: flex-start; /* 讓內容從頂部開始，而非置中 */
			padding-top: 20px; /* 給頂部一點留白 */
        }

        .game-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .word-display-box {
            font-size: clamp(3rem, 15vw, 5rem); /* 響應式字體大小 */
            min-height: 140px;
            border: 4px dashed #a5d6a7;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--forest-green);
            background-color: #f9fdf9;
        }

        .option-btn {
            font-size: 1.8rem;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #a5d6a7;
            background: white;
            transition: all 0.2s;
            border-radius: 12px;
            color: #2e7d32;
        }

        .option-btn:hover {
            background-color: #f1f8e9;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .option-btn.correct {
            background-color: var(--forest-green) !important;
            border-color: var(--forest-green) !important;
            color: white !important;
        }

        #message {
            height: 32px;
            font-weight: bold;
        }

        .progress {
            height: 10px;
            border-radius: 10px;
        }
		
		ruby {
			align-items: center;
			display: inline-flex;
			font-family: "Times New Roman", Times, "標楷體", "BiauKai", "DFKai-sb", "TWKai", "Microsoft JhengHei", sans-serif;
			line-height: 1;
			min-height: 1em;
		}

		ruby rt {
			display: block;
			font-family: "Bopomofo", "標楷體", "BiauKai", "DFKai-sb", "TWKai", "Microsoft JhengHei";
			font-size: 30%;
			font-weight: 500;
			line-height: 1;
			text-align: center;
			padding-left: 0.1em;
			position: relative;
			-webkit-text-orientation: upright;
			text-orientation: upright;
			writing-mode: vertical-lr;
			white-space: nowrap;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			width: 1.5em;
		}
		
		ruby span {
			border: 1px solid;
		}
		
		@font-face {
			font-family: "Bopomofo";
			src: url("font/bopomofo.woff2") format("woff2"), url("font/bopomofo.woff") format("woff");
		}
    </style>
</head>
<body>
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7 text-center">
            
            <h1 class="fw-bold mb-2" style="color: var(--forest-green);">森林拆字守護者 🌳</h1>
            <p class="text-muted mb-4">點擊正確的部件，幫「字寶寶」找回它的零件吧！</p>

            <div class="card game-card p-3 p-md-5">
                <div class="progress mb-3">
                    <div id="game-progress" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                </div>

                <div class="mb-2 text-secondary fw-bold"  style="font-size: 3rem;">
                    目標國字：<span id="current-full-word" class="text-dark">?</span>
                </div>

                <div class="word-display-box mb-4 shadow-sm" id="display-area">?</div>
                
                <div id="message" class="mb-3 text-success"></div>

                <div class="d-flex flex-wrap justify-content-center gap-3 mb-4" id="options">
                    </div>

                <div class="d-grid gap-2 col-8 col-md-6 mx-auto">
                    <button id="next-btn" class="btn btn-success btn-lg shadow" onclick="nextLevel()" style="display: none;">
                        下一個關卡 ✨
                    </button>
                </div>
            </div>

            <p class="mt-4 text-secondary small">練習進度：<span id="progress-text">0</span>/<span id="progress-tot">0</span></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

arts":["冫","水"],"vocab":[{"text":"浮","bopomo":"ㄈㄨˊ"},{"text":"冰","bopomo":"ㄅㄧㄥ"}]},{"word":"陸","parts":["阝","土","ㄦ","土"],"vocab":[{"text":"陸","bopomo":"ㄌㄨˋ"},{"text":"地","bopomo":"ㄉㄧˋ"}]},{"word":"肺","parts":["月","市"],"vocab":[{"text":"心","bopomo":"ㄒㄧㄣ"},{"text":"肺","bopomo":"ㄈㄟˋ"}]},{"word":"膚","parts":["虍","胃"],"vocab":[{"text":"皮","bopomo":"ㄆㄧˊ"},{"text":"膚","bopomo":"ㄈㄨ"}]},{"word":"黏","parts":["黍","占"],"vocab":[{"text":"黏","bopomo":"ㄋㄧㄢˊ"},{"text":"貼","bopomo":"ㄊㄧㄝ"}]},{"word":"液","parts":["氵","夜"],"vocab":[{"text":"液","bopomo":"ㄧㄝˋ"},{"text":"體","bopomo":"ㄊㄧˇ"}]},{"word":"保","parts":["亻","呆"],"vocab":[{"text":"保","bopomo":"ㄅㄠˇ"},{"text":"存","bopomo":"ㄘㄨㄣˊ"}]},{"word":"持","parts":["手","士","寸"],"vocab":[{"text":"維","bopomo":"ㄨㄟˊ"},{"text":"持","bopomo":"ㄔˊ"}]},{"word":"敵","parts":["立","ㄇ","古","攴"],"vocab":[{"text":"敵","bopomo":"ㄉㄧˊ"},{"text":"人","bopomo":"ㄖㄣˊ"}]},{"word":"縫","parts":["糹","夂","丰","辶"],"vocab":[{"text":"門","bopomo":"ㄇㄣˊ"},{"text":"縫","bopomo":"ㄈㄥˋ"}]},{"word":"伐","parts":["亻","戈"],"vocab":[{"text":"砍","bopomo":"ㄎㄢˇ"},{"text":"伐","bopomo":"ㄈㄚ"}]},{"word":"球","parts":["𤣩","求"],"vocab":[{"text":"地","bopomo":"ㄉㄧˋ"},{"text":"球","bopomo":"ㄑㄧㄡˊ"}]},{"word":"椒","parts":["木","上","小","又"],"vocab":[{"text":"山","bopomo":"ㄕㄢ"},{"text":"椒","bopomo":"ㄐㄧㄠ"},{"text":"魚","bopomo":"ㄩˊ"}]},{"word":"鰓","parts":["魚","田","心"],"vocab":[{"text":"魚","bopomo":"ㄩˊ"},{"text":"鰓","bopomo":"ㄙㄞ"}]},{"word":"隙","parts":["阝","小","白","小"],"vocab":[{"text":"孔","bopomo":"ㄎㄨㄥˇ"},{"text":"隙","bopomo":"ㄒㄧˋ"}]},{"word":"卵","parts":["卵"],"vocab":[{"text":"魚","bopomo":"ㄩˊ"},{"text":"卵","bopomo":"ㄌㄨㄢˇ"}]},{"word":"漁","parts":["氵","魚"],"vocab":[{"text":"漁","bopomo":"ㄩˊ"},{"text":"夫","bopomo":"ㄈㄨ"}]},{"word":"夫","parts":["二","人"],"vocab":[{"text":"夫","bopomo":"ㄈㄨ"},{"text":"婦","bopomo":"ㄈㄨˋ"}]},{"word":"婦","parts":["女","帚"],"vocab":[{"text":"夫","bopomo":"ㄈㄨ"},{"text":"婦","bopomo":"ㄈㄨˋ"}]},{"word":"拖","parts":["扌","𠂉","也"],"vocab":[{"text":"拖","bopomo":"ㄊㄨㄛ"},{"text":"拉","bopomo":"ㄌㄚ"}]},{"word":"求","parts":["求"],"vocab":[{"text":"請","bopomo":"ㄑㄧㄥˇ"},{"text":"求","bopomo":"ㄑㄧㄡˊ"}]},{"word":"恩","parts":["因","心"],"vocab":[{"text":"恩","bopomo":"ㄣ"},{"text":"情","bopomo":"ㄑㄧㄥˊ"}]},{"word":"報","parts":["幸","卩","又"],"vocab":[{"text":"回","bopomo":"ㄏㄨㄟˊ"},{"text":"報","bopomo":"ㄅㄠˋ"}]},{"word":"盆","parts":["分","皿"],"vocab":[{"text":"木","bopomo":"ㄇㄨˋ"},{"text":"盆","bopomo":"ㄆㄣˊ"}]},{"word":"值","parts":["亻","直"],"vocab":[{"text":"價","bopomo":"ㄐㄧㄚˋ"},{"text":"值","bopomo":"ㄓˊ"}]},{"word":"寬","parts":["宀","十","十","見","、"],"vocab":[{"text":"寬","bopomo":"ㄎㄨㄢ"},{"text":"大","bopomo":"ㄉㄚˋ"}]},{"word":"暴","parts":["日","共","氺"],"vocab":[{"text":"風","bopomo":"ㄈㄥ"},{"text":"暴","bopomo":"ㄅㄠˋ"}]},{"word":"聊","parts":["耳","卯"],"vocab":[{"text":"無","bopomo":"ㄨˊ"},{"text":"聊","bopomo":"ㄌㄧㄠˊ"}]},{"word":"隆","parts":["阝","夊","一","生"],"vocab":[{"text":"轟","bopomo":"ㄏㄨㄥ"},{"text":"隆","bopomo":"ㄌㄨㄥˊ"}]},{"word":"破","parts":["石","皮"],"vocab":[{"text":"破","bopomo":"ㄆㄛˋ"},{"text":"洞","bopomo":"ㄉㄨㄥˋ"}]},{"word":"藻","parts":["艹","氵","品","木"],"vocab":[{"text":"水","bopomo":"ㄕㄨㄟˇ"},{"text":"藻","bopomo":"ㄗㄠˇ"}]},{"word":"濤","parts":["水","士","乛","工","一","口","寸"],"vocab":[{"text":"波","bopomo":"ㄅㄛ"},{"text":"濤","bopomo":"ㄊㄠˊ"}]},{"word":"僕","parts":["亻","菐"],"vocab":[{"text":"僕","bopomo":"ㄆㄨˊ"},{"text":"人","bopomo":"ㄖㄣˊ"}]},{"word":"轟","parts":["車","車","車"],"vocab":[{"text":"轟","bopomo":"ㄏㄨㄥ"},{"text":"隆","bopomo":"ㄌㄨㄥˊ"}]}];
		
		document.querySelector("#progress-tot").textContent = quizData.length;

        let currentIdx = 0;
        let foundParts = [];

        function initLevel() {
		    document.querySelector("#progress-text").textContent = currentIdx+1;
            const data = quizData[currentIdx];
			let full_word = data.vocab.map((v)=>{return '<ruby><span>'+v.text+'</span><rt>'+v.bopomo+'</rt>'+'</ruby>'}).join('').replace(data.word,'　');
            document.getElementById('current-full-word').innerHTML = full_word;
			
            document.getElementById('display-area').innerText = "";
            document.getElementById('message').innerText = "";
            document.getElementById('next-btn').style.display = "none";
            foundParts = [];
            
            // 產生選項（包含正確與干擾項）
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = "";
            
            // 混合所有部件作為選項
            let allOptions = ["木","同","爪","巴","衤","刀","一","自","夊","月","覀","女","耳","又","扌","台","肖","礻","曲","豆","戶","尚","手","辛","瓜","金","甫","立","里","氵","九","復","亞","𥫗","方","𠂉","矢","艹","心","予","卯","斤","貝","山","甲","𧾷","八","亻","歹","刂","門","王","石","古","周","隹","朔","土","㇀","田","ㄦ","ㄙ","龜","火","罒","勹","虫","戈","府","肉","糹","言","弓","冫","水","阝","市","虍","胃","黍","占","夜","呆","士","寸","ㄇ","攴","夂","丰","辶","𤣩","求","上","小","魚","白","卵","二","人","帚","也","因","幸","卩","分","皿","直","宀","十","見","、","日","共","氺","生","皮","品","乛","工","口","菐","車"];
			
			// 總button數 = 12
			let tot_buttons = 12;
			// 隨機抽取干擾數
			let random_options = allOptions.filter(x=>!data.parts.includes(x)).sort(() => Math.random() - 0.5).slice(0,tot_buttons-data.parts.length);
			
			let show_options = [...random_options, ...data.parts].sort(() => Math.random() - 0.5);
			

            show_options.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = p;
                btn.onclick = () => checkPart(p, btn);
                optionsDiv.appendChild(btn);
            });
        }

        function checkPart(p, btn) {
            const data = quizData[currentIdx];
            // 檢查點擊的部件是否在正確清單中，且尚未被找齊次數
            const targetCount = data.parts.filter(x => x === p).length;
            const currentCount = foundParts.filter(x => x === p).length;

            if (data.parts.includes(p) && currentCount < targetCount) {
                foundParts.push(p);
                btn.classList.add('correct');
                document.getElementById('display-area').innerText = foundParts.join(" + ");
                
                if (foundParts.length === data.parts.length) {
                    document.getElementById('message').innerText = "太棒了！守護成功！✨";
                    document.getElementById('next-btn').style.display = "inline-block";
                }
            } else {
                document.getElementById('message').innerText = "再試試看喔，你可以的！🌱";
                setTimeout(() => { document.getElementById('message').innerText = ""; }, 1500);
            }
        }

        function nextLevel() {
            currentIdx = (currentIdx + 1) % quizData.length;
            initLevel();
        }

        // 啟動第一關
        initLevel();
