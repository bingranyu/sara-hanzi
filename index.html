<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>森林拆字守護者</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --forest-green: #2e7d32;
            --light-forest: #e8f5e9;
        }

        body {
			background-color: var(--light-forest);
			font-family: "Microsoft JhengHei", sans-serif;
			min-height: 100vh;
			display: flex;
			flex-direction: column; /* 確保內容由上而下排列 */
			align-items: center;
			justify-content: flex-start; /* 讓內容從頂部開始，而非置中 */
			padding-top: 20px; /* 給頂部一點留白 */
        }

        .game-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .word-display-box {
            font-size: clamp(3rem, 15vw, 5rem); /* 響應式字體大小 */
            min-height: 140px;
            border: 4px dashed #a5d6a7;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--forest-green);
            background-color: #f9fdf9;
        }

        .option-btn {
            font-size: 1.8rem;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #a5d6a7;
            background: white;
            transition: all 0.2s;
            border-radius: 12px;
            color: #2e7d32;
        }

        .option-btn:hover {
            background-color: #f1f8e9;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .option-btn.correct {
            background-color: var(--forest-green) !important;
            border-color: var(--forest-green) !important;
            color: white !important;
        }

        #message {
            height: 32px;
            font-weight: bold;
        }

        .progress {
            height: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7 text-center">
            
            <h1 class="fw-bold mb-2" style="color: var(--forest-green);">森林拆字守護者 🌳</h1>
            <p class="text-muted mb-4">點擊正確的部件，幫「字寶寶」找回它的零件吧！</p>

            <div class="card game-card p-3 p-md-5">
                <div class="progress mb-3">
                    <div id="game-progress" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                </div>

                <div class="mb-2 text-secondary fw-bold">
                    目標國字：<span id="current-full-word" class="fs-4 text-dark">?</span>
                </div>

                <div class="word-display-box mb-4 shadow-sm" id="display-area">?</div>
                
                <div id="message" class="mb-3 text-success"></div>

                <div class="d-flex flex-wrap justify-content-center gap-3 mb-4" id="options">
                    </div>

                <div class="d-grid gap-2 col-8 col-md-6 mx-auto">
                    <button id="next-btn" class="btn btn-success btn-lg shadow" onclick="nextLevel()" style="display: none;">
                        下一個關卡 ✨
                    </button>
                </div>
            </div>

            <p class="mt-4 text-secondary small">練習進度：<span id="progress-text">0/0</span></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 設定題目：國字與對應的部件
        const quizData = [
            { word: "桐", parts: ["木", "同"] },
            { word: "爬", parts: ["爪", "巴"] },
            { word: "桐", parts: ["木", "同"] },
            { word: "初", parts: ["衣", "刀"] },
            { word: "夏", parts: ["一","自", "夊"] },
            { word: "腰", parts: ["肉", "西", "女"] },
            { word: "取", parts: ["耳", "又"] },
            { word: "抬", parts: ["手", "台"] },
            { word: "梢", parts: ["木", "肖"] },
            { word: "禮", parts: ["示", "曲", "豆"] },
            { word: "肩", parts: ["戶", "肉"] },
            { word: "掌", parts: ["尚", "手"] },
            { word: "瓣", parts: ["辛", "瓜", "辛"] },
            { word: "鋪", parts: ["金", "甫"] },
            { word: "童", parts: ["立", "里"] },
            { word: "染", parts: ["水", "九", "木"] },
            { word: "覆", parts: ["西", "復"] },
            { word: "椏", parts: ["木", "亞"] },
            { word: "簇", parts: ["竹", "族"] },
            { word: "蕊", parts: ["艸", "惢"] },
            { word: "野", parts: ["里", "予"] },
            { word: "柳", parts: ["木", "卯"] },
            { word: "質", parts: ["斤", "斤", "貝"] },
            { word: "岬", parts: ["山", "甲"] },
            { word: "趴", parts: ["足", "八"] },
            { word: "仙", parts: ["人", "山"] },
            { word: "列", parts: ["歹", "刀"] },
            { word: "潤", parts: ["水", "門", "王"] },
            { word: "岩", parts: ["山", "石"] },
            { word: "菇", parts: ["艸", "女", "古"] },
            { word: "豆", parts: ["豆"] },
            { word: "雕", parts: ["周", "隹"] },
            { word: "塑", parts: ["朔", "土"] },
            { word: "鬼", parts: ["’", "田", "ㄦ", "ㄙ"] },
            { word: "龜", parts: ["龜"] },
            { word: "燭", parts: ["火", "蜀"] },
            { word: "濺", parts: ["水", "貝", "戈", "戈"] },
            { word: "腐", parts: ["府", "肉"] },
            { word: "灣", parts: ["水", "彎"] },
            { word: "冰", parts: ["水", "水"] },
            { word: "爬", parts: ["爪", "巴"] },
            { word: "陸", parts: ["阜", "土", "ㄦ", "土"] },
            { word: "肺", parts: ["肉", "市"] },
            { word: "膚", parts: ["虍", "胃"] },
            { word: "黏", parts: ["黍", "占"] },
            { word: "液", parts: ["水", "夜"] },
            { word: "保", parts: ["人", "呆"] },
            { word: "持", parts: ["手", "寺"] },
            { word: "敵", parts: ["立", "ㄇ", "古", "攴"] },
            { word: "縫", parts: ["糸", "逢"] },
            { word: "伐", parts: ["人", "戈"] },
            { word: "球", parts: ["玉", "求"] },
            { word: "椒", parts: ["木", "叔"] },
            { word: "鰓", parts: ["魚", "思"] },
            { word: "隙", parts: ["阜", "小", "日", "小"] },
            { word: "卵", parts: ["卵"] }
        ];

        let currentIdx = 0;
        let foundParts = [];

        function initLevel() {
            const data = quizData[currentIdx];
            document.getElementById('current-full-word').innerText = data.word;
            document.getElementById('display-area').innerText = "";
            document.getElementById('message').innerText = "";
            document.getElementById('next-btn').style.display = "none";
            foundParts = [];
            
            // 產生選項（包含正確與干擾項）
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = "";
            
            // 混合所有部件作為選項
            let allOptions = [
			"木", "同", "衣", "刀", "頁", "夊", "肉", "要", "耳", "又", 
			"手", "台", "肖", "示", "豐", "戶", "尚", "辛", "瓜", "金", 
			"甫", "立", "里", "水", "九", "西", "復", "竹", "族", "艸", 
			"惢", "予", "卯", "斤", "貝", "山", "甲", "足", "八", "人", 
			"歹", "門", "王", "石", "姑", "豆", "周", "隹", "朔", "土", 
			"鬼", "龜", "火", "蜀", "貝", "府", "弓", "爪", "巴", "阜", 
			"坴", "市", "虍", "胃", "黍", "占", "夜", "呆", "寺", "舌", 
			"支", "攴", "糸", "逢", "戈", "玉", "求", "叔", "魚", "思", 
			"小", "日", "卵","言",
			"手", "口", "日", "水", "心" // 指定加入的混合選項
			];
			
			// 總button數 = 12
			let tot_buttons = 12;
			// 隨機抽取干擾數
			let random_options = allOptions.filter(x=>!data.parts.includes(x)).sort(() => Math.random() - 0.5).slice(0,tot_buttons-data.parts.length);
			
			let show_options = [...random_options, ...data.parts].sort(() => Math.random() - 0.5);
			

            show_options.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = p;
                btn.onclick = () => checkPart(p, btn);
                optionsDiv.appendChild(btn);
            });
        }

        function checkPart(p, btn) {
            const data = quizData[currentIdx];
            // 檢查點擊的部件是否在正確清單中，且尚未被找齊次數
            const targetCount = data.parts.filter(x => x === p).length;
            const currentCount = foundParts.filter(x => x === p).length;

            if (data.parts.includes(p) && currentCount < targetCount) {
                foundParts.push(p);
                btn.classList.add('correct');
                document.getElementById('display-area').innerText = foundParts.join(" + ");
                
                if (foundParts.length === data.parts.length) {
                    document.getElementById('message').innerText = "太棒了！守護成功！✨";
                    document.getElementById('next-btn').style.display = "inline-block";
                }
            } else {
                document.getElementById('message').innerText = "再試試看喔，你可以的！🌱";
                setTimeout(() => { document.getElementById('message').innerText = ""; }, 1500);
            }
        }

        function nextLevel() {
            currentIdx = (currentIdx + 1) % quizData.length;
            initLevel();
        }

        // 啟動第一關
        initLevel();
    </script>
</body>
</html>
