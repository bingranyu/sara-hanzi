<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>森林拆字守護者</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --forest-green: #2e7d32;
            --light-forest: #e8f5e9;
        }

        body {
			background-color: var(--light-forest);
			font-family: "Microsoft JhengHei", sans-serif;
			min-height: 100vh;
			display: flex;
			flex-direction: column; /* 確保內容由上而下排列 */
			align-items: center;
			justify-content: flex-start; /* 讓內容從頂部開始，而非置中 */
			padding-top: 20px; /* 給頂部一點留白 */
        }

        .game-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .word-display-box {
            font-size: clamp(3rem, 15vw, 5rem); /* 響應式字體大小 */
            min-height: 140px;
            border: 4px dashed #a5d6a7;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--forest-green);
            background-color: #f9fdf9;
        }

        .option-btn {
            font-size: 1.8rem;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #a5d6a7;
            background: white;
            transition: all 0.2s;
            border-radius: 12px;
            color: #2e7d32;
        }

        .option-btn:hover {
            background-color: #f1f8e9;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .option-btn.correct {
            background-color: var(--forest-green) !important;
            border-color: var(--forest-green) !important;
            color: white !important;
        }

        #message {
            height: 32px;
            font-weight: bold;
        }

        .progress {
            height: 10px;
            border-radius: 10px;
        }
		
		ruby {
			align-items: center;
			display: inline-flex;
			font-family: "Times New Roman", Times, "標楷體", "BiauKai", "DFKai-sb", "TWKai", "Microsoft JhengHei", sans-serif;
			line-height: 1;
			min-height: 1em;
		}

		ruby rt {
			display: block;
			font-family: "Bopomofo", "標楷體", "BiauKai", "DFKai-sb", "TWKai", "Microsoft JhengHei";
			font-size: 30%;
			font-weight: 500;
			line-height: 1;
			text-align: center;
			padding-left: 0.1em;
			position: relative;
			-webkit-text-orientation: upright;
			text-orientation: upright;
			writing-mode: vertical-lr;
			white-space: nowrap;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			width: 1.5em;
		}
		
		ruby span {
			border: 1px solid;
		}
		
		/* 答對後回填目標字的專屬綠色樣式 */
        .correct-fill-text {
            color: var(--forest-green);
            font-weight: 900;
        }

        /* 星星標籤樣式 */
        .star-badge {
            font-size: 1.8rem;
            color: #ffb300;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 5px;
        }
		
		@font-face {
			font-family: "Bopomofo";
			src: url("font/bopomofo.woff2") format("woff2"), url("font/bopomofo.woff") format("woff");
		}
    </style>
</head>
<body>
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7 text-center">
            
            <h1 class="fw-bold mb-2" style="color: var(--forest-green);">森林拆字守護者 🌳</h1>
            <p class="text-muted mb-4">點擊正確的部件，幫「字寶寶」找回它的零件吧！</p>

            <div class="card game-card p-3 p-md-5">
                <div class="progress mb-3">
                    <div id="game-progress" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                </div>

                <div id="star-area" class="star-badge"></div>

                <div class="mb-2 text-secondary fw-bold"  style="font-size: 3rem;">
                    目標國字：<span id="current-full-word" class="text-dark">?</span>
                </div>

                <div class="word-display-box mb-4 shadow-sm" id="display-area"></div>
                
                <div id="message" class="mb-3 text-success"></div>

                <div class="d-flex flex-wrap justify-content-center gap-3 mb-4" id="options"></div>

                <div class="d-grid gap-2 col-8 col-md-6 mx-auto">

                    <button id="next-btn" class="btn btn-success btn-lg shadow" onclick="nextLevel()" style="display: none;">

            <p class="mt-4 text-secondary small">本輪練習進度：<span id="progress-text">0</span>/<span id="progress-tot">0</span></p>
        </div>
    </div>
</div>

ord":"求","parts":["求"],"vocab":[{"text":"請","bopomo":"ㄑㄧㄥˇ"},{"text":"求","bopomo":"ㄑㄧㄡˊ"}]},{"word":"恩","parts":["因","心"],"vocab":[{"text":"恩","bopomo":"ㄣ"},{"text":"情","bopomo":"ㄑㄧㄥˊ"}]},{"word":"報","parts":["幸","卩","又"],"vocab":[{"text":"回","bopomo":"ㄏㄨㄟˊ"},{"text":"報","bopomo":"ㄅㄠˋ"}]},{"word":"盆","parts":["分","皿"],"vocab":[{"text":"木","bopomo":"ㄇㄨˋ"},{"text":"盆","bopomo":"ㄆㄣˊ"}]},{"word":"值","parts":["亻","直"],"vocab":[{"text":"價","bopomo":"ㄐㄧㄚˋ"},{"text":"值","bopomo":"ㄓˊ"}]},{"word":"寬","parts":["宀","十","十","見","、"],"vocab":[{"text":"寬","bopomo":"ㄎㄨㄢ"},{"text":"大","bopomo":"ㄉㄚˋ"}]},{"word":"暴","parts":["日","共","氺"],"vocab":[{"text":"風","bopomo":"ㄈㄥ"},{"text":"暴","bopomo":"ㄅㄠˋ"}]},{"word":"聊","parts":["耳","卯"],"vocab":[{"text":"無","bopomo":"ㄨˊ"},{"text":"聊","bopomo":"ㄌㄧㄠˊ"}]},{"word":"隆","parts":["阝","夊","一","生"],"vocab":[{"text":"轟","bopomo":"ㄏㄨㄥ"},{"text":"隆","bopomo":"ㄌㄨㄥˊ"}]},{"word":"破","parts":["石","皮"],"vocab":[{"text":"破","bopomo":"ㄆㄛˋ"},{"text":"洞","bopomo":"ㄉㄨㄥˋ"}]},{"word":"藻","parts":["艹","氵","品","木"],"vocab":[{"text":"水","bopomo":"ㄕㄨㄟˇ"},{"text":"藻","bopomo":"ㄗㄠˇ"}]},{"word":"濤","parts":["水","士","乛","工","一","口","寸"],"vocab":[{"text":"波","bopomo":"ㄅㄛ"},{"text":"濤","bopomo":"ㄊㄠˊ"}]},{"word":"僕","parts":["亻","菐"],"vocab":[{"text":"僕","bopomo":"ㄆㄨˊ"},{"text":"人","bopomo":"ㄖㄣˊ"}]},{"word":"轟","parts":["車","車","車"],"vocab":[{"text":"轟","bopomo":"ㄏㄨㄥ"},{"text":"隆","bopomo":"ㄌㄨㄥˊ"}]}];
		


        let quizData = []; // 本輪抽選出的 20 題
        let currentIdx = 0;
        let userAnswers = [];
        let db = null;

		// 1. 初始化 IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("ForestWordDB", 1);
                
                request.onupgradeneeded = function(e) {
                    const dbInstance = e.target.result;
                    if (!dbInstance.objectStoreNames.contains("wordProgress")) {
                        dbInstance.createObjectStore("wordProgress", { keyPath: "word" });
                    }
                };

                request.onsuccess = function(e) {
                    db = e.target.result;
                    resolve();
                };

                request.onerror = function(e) {
                    console.error("IndexedDB 開啟失敗", e);
                    reject();
                };
            });
        }
		
		// 2. 取得某個字的答對次數
        function getWordCount(word) {
            return new Promise((resolve) => {
                const transaction = db.transaction(["wordProgress"], "readonly");
                const store = transaction.objectStore(["wordProgress"]);
                const request = store.get(word);
                request.onsuccess = function(e) {
                    if (e.target.result) {
                        resolve(e.target.result.count || 0);
                    } else {
                        resolve(0);
                    }
                };
                request.onerror = function() {
                    resolve(0);
                };
            });
        }

        // 3. 更新某個字的答對次數 (isCorrect為true則+1，最高5；false則清零)
        function updateWordCount(word, isCorrect) {
            return new Promise((resolve) => {
                const transaction = db.transaction(["wordProgress"], "readwrite");
                const store = transaction.objectStore(["wordProgress"]);
                const request = store.get(word);

                request.onsuccess = function(e) {
                    let data = e.target.result || { word: word, count: 0 };
                    if (isCorrect) {
                        data.count = Math.min(5, data.count + 1);
                    } else {
                        data.count = 0;
                    }
                    store.put(data);
                    resolve(data.count);
                };
            });
        }

        // 4. 加權抽選 20 個字建立當前輪次題庫
        async function generateQuizSession() {
            let listWithWeights = [];
            
            // 讀取所有字的目前次數並計算權重
            for (let item of rawQuizData) {
                const count = await getWordCount(item.word);
                let weight = 5; // 預設 0 次為 5
                if (count === 1) weight = 4;
                else if (count === 2) weight = 3;
                else if (count === 3) weight = 2;
                else if (count === 4) weight = 1;
                else if (count === 5) weight = 0.1; // 5次最低
                
                listWithWeights.push({ item: item, weight: weight });
            }

            // 根據加權比例隨機抽取 20 題
            let selected = [];
            const targetCount = Math.min(20, rawQuizData.length);

            while (selected.length < targetCount && listWithWeights.length > 0) {
                let totalWeight = listWithWeights.reduce((sum, el) => sum + el.weight, 0);
                let randomNum = Math.random() * totalWeight;
                let currentSum = 0;
                
                for (let i = 0; i < listWithWeights.length; i++) {
                    currentSum += listWithWeights[i].weight;
                    if (randomNum <= currentSum) {
                        selected.push(listWithWeights[i].item);
                        listWithWeights.splice(i, 1); // 避免重複抽取
                        break;
                    }
                }
            }

            quizData = selected;
            document.querySelector("#progress-tot").textContent = quizData.length;
        }

// 初始化關卡
        async function initLevel() {
            if (quizData.length === 0) return;
            
		    document.querySelector("#progress-text").textContent = currentIdx + 1;
            const data = quizData[currentIdx];
            
            // 呈現星星進度
            const currentCount = await getWordCount(data.word);
            renderStars(currentCount);

			let full_word = data.vocab.map((v)=>{return '<ruby><span>'+v.text+'</span><rt>'+v.bopomo+'</rt>'+'</ruby>'}).join('').replace(data.word,'　');
            document.getElementById('current-full-word').innerHTML = full_word;
			
            document.getElementById('message').innerText = "";
            document.getElementById('next-btn').style.display = "none";
            document.getElementById('submit-btn').style.display = "inline-block";
            
            userAnswers = new Array(data.parts.length).fill("");
            renderSlots();
            
            // 產生選項
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = "";
            
            let allOptions = ["木","同","爪","巴","衤","刀","一","自","夊","月","覀","女","耳","又","扌","台","肖","礻","曲","豆","戶","尚","手","辛","瓜","金","甫","立","里","氵","九","復","亞","𥫗","方","𠂉","矢","艹","心","予","卯","斤","貝","山","甲","𧾷","八","亻","歹","刂","門","王","石","古","周","隹","朔","土","㇀","田","ㄦ","ㄙ","龜","火","罒","勹","虫","戈","府","肉","糹","言","弓","冫","水","阝","市","虍","胃","黍","占","夜","呆","士","寸","ㄇ","攴","夂","丰","辶","𤣩","求","上","小","魚","白","卵","二","人","帚","也","因","幸","卩","分","皿","直","宀","十","見","、","日","共","氺","生","皮","品","乛","工","口","菐","車"];
			
			let tot_buttons = 12;
			
			const uniqueParts = [...new Set(data.parts)];
			let random_options = allOptions.filter(x => !uniqueParts.includes(x)).sort(() => Math.random() - 0.5).slice(0, tot_buttons - uniqueParts.length);
			let show_options = [...new Set([...random_options, ...uniqueParts])].sort(() => Math.random() - 0.5);
			

            show_options.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = p;
                btn.onclick = () => addPart(p);
                optionsDiv.appendChild(btn);
            });

            let progressPercent = (currentIdx / quizData.length) * 100;
            document.getElementById('game-progress').style.width = progressPercent + '%';
        }



// 渲染星星進度
        function renderStars(count) {
            const starArea = document.getElementById('star-area');
            let starsHTML = "";
            for (let i = 1; i <= 5; i++) {
                if (i <= count) {
                    starsHTML += "⭐";
                } else {
                    starsHTML += "★"; // 空心星
                }
            }
            starArea.innerHTML = starsHTML;
        }

        // 渲染格子
        function renderSlots() {
            const displayArea = document.getElementById('display-area');
            displayArea.innerHTML = "";

            userAnswers.forEach((part, index) => {
                const slot = document.createElement('div');
                if (part === "") {
                    slot.className = 'component-slot';
                    slot.innerText = "？";
                } else {
                    slot.className = 'component-slot filled';
                    slot.innerText = part;
                    slot.onclick = () => removePart(index);
                }
                displayArea.appendChild(slot);
            });
        }

        function addPart(p) {
            const emptyIndex = userAnswers.indexOf("");
            if (emptyIndex !== -1) {
                userAnswers[emptyIndex] = p;
                renderSlots();
                document.getElementById('message').innerText = "";
            }
        }

        function removePart(index) {
            userAnswers[index] = "";
            renderSlots();
            document.getElementById('message').innerText = "";
        }

        // 點擊「確定」：驗證答案
        async function submitAnswer() {
            const data = quizData[currentIdx];

            if (userAnswers.includes("")) {
                document.getElementById('message').innerText = "請先把格子都填滿再檢查喔！🌱";
                return;
            }

            const sortedUser = [...userAnswers].sort();
            const sortedTarget = [...data.parts].sort();

            let isCorrect = true;
            for (let i = 0; i < sortedTarget.length; i++) {
                if (sortedUser[i] !== sortedTarget[i]) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                document.getElementById('message').innerText = "太棒了！守護成功！✨";
                document.getElementById('next-btn').style.display = "inline-block";
                document.getElementById('submit-btn').style.display = "none";
                
                // 功能1追加：驗證成功後，回填挖空的目標漢字並指定特殊樣式呈現
                let reveal_word = data.vocab.map((v)=>{
                    let isTarget = (v.text === data.word);
                    let textSpan = isTarget ? `<span class="correct-fill-text">${v.text}</span>` : `<span>${v.text}</span>`;
                    return '<ruby>' + textSpan + '<rt>'+v.bopomo+'</rt>'+'</ruby>';
                }).join('');
                document.getElementById('current-full-word').innerHTML = reveal_word;

                // 功能2追加：更新 IndexedDB 進度次數 (+1)
                const newCount = await updateWordCount(data.word, true);
                renderStars(newCount); // 即時刷新星星外觀
                
                let progressPercent = ((currentIdx + 1) / quizData.length) * 100;
                document.getElementById('game-progress').style.width = progressPercent + '%';
            } else {
                document.getElementById('message').innerText = "再試試看喔，零件好像裝錯了！🧩";
                // 功能2追加：答案錯誤，累計計次清零
                const newCount = await updateWordCount(data.word, false);
                renderStars(newCount);
            }
        }

        function nextLevel() {
            currentIdx = (currentIdx + 1) % quizData.length;
            initLevel();
        }

        // 遊戲總啟動點
        async function startGame() {
            await initDB();              // 開啟資料庫
            await generateQuizSession(); // 加權抽取 20 題
            initLevel();                 // 載入第一關
        }

        startGame();
