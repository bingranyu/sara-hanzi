<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>森林拆字守護者</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
	    @font-face { font-family:'部件'; src:url('font/cns11643webv5.woff'); }
        :root {
            --forest-green: #2e7d32;
            --light-forest: #e8f5e9;
        }

        body {
			background-color: var(--light-forest);
			font-family: "Microsoft JhengHei", sans-serif;
			min-height: 100vh;
			display: flex;
			flex-direction: column; 
			align-items: center;
			justify-content: center; /* 【修改標記】改為置中，讓畫面在不同裝置上都能有和諧的上下配比 */
			padding: 10px; /* 【修改標記】縮小四周襯距，避免小螢幕過度擠壓 */
            margin: 0;
        }

        /* 【修改標記】限制遊戲主卡片的最大高度與寬度，確保橫式螢幕（如iPad）不會穿出畫面 */
        .game-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-height: 85vh; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 【修改標記】微調字寶寶展示框：將高度和文字大小改為響應式，在短螢幕下自動縮小 */
        .word-display-box {
            font-size: clamp(2rem, 8vh, 4rem); 
            min-height: clamp(80px, 12vh, 130px);
            border: 4px dashed #a5d6a7;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--forest-green);
            background-color: #f9fdf9;
        }

        /* 【修改標記】重構選項按鈕樣式：加入 flex-grow 與更彈性的寬高，手機大拇指更好點擊，橫屏自動適應 */
        .option-btn {
            font: clamp(1.4rem, 4vh, 1.8rem) 部件;
            min-width: 65px;
            height: clamp(55px, 8vh, 70px);
            flex: 1 1 calc(16% - 10px); /* 在大螢幕排成一列多個，手機上自動撐開 */
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #a5d6a7;
            background: white;
            transition: all 0.2s;
            border-radius: 12px;
            color: #2e7d32;
        }

        .option-btn:hover {
            background-color: #f1f8e9;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .option-btn.correct {
            background-color: var(--forest-green) !important;
            border-color: var(--forest-green) !important;
            color: white !important;
        }

        #message {
            height: 24px;
            font-weight: bold;
            font-size: clamp(0.9rem, 2.5vh, 1.2rem); /* 【修改標記】動態字體大小 */
        }

        .progress {
            height: 10px;
            border-radius: 10px;
        }
		
		ruby {
			align-items: center;
			display: inline-flex;
			font-family: "Times New Roman", Times, "標楷體", "BiauKai", "DFKai-sb", "TWKai", "Microsoft JhengHei", sans-serif;
			line-height: 1;
			min-height: 1em;
		}

		ruby rt {
			display: block;
			font-family: "Bopomofo", "標楷體", "BiauKai", "DFKai-sb", "TWKai", "Microsoft JhengHei";
			font-size: 30%;
			font-weight: 500;
			line-height: 1;
			text-align: center;
			padding-left: 0.1em;
			position: relative;
			-webkit-text-orientation: upright;
			text-orientation: upright;
			writing-mode: vertical-lr;
			white-space: nowrap;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
			width: 1.5em;
		}
		
		ruby span {
			border: 1px solid;
		}
		
		/* 答對後回填目標字的專屬綠色樣式 */
        .correct-fill-text {
            color: var(--forest-green);
            font-weight: 900;
        }
		
		/* 答錯後回填目標字的專屬紅色樣式 */
		.wrong-fill-text {
			color: #d32f2f;
			font-weight: 900;
		}

        /* 星星標籤樣式 */
        .star-badge {
            font-size: clamp(1.2rem, 3vh, 1.8rem); /* 【修改標記】隨視窗高度縮放 */
            color: #ffb300;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 5px;
        }
		
		div#display-area {
			font-family: 部件;
		}
		span.result-parts {
			font-family: 部件;
		}
		
		@font-face {
			font-family: "Bopomofo";
			src: url("font/bopomofo.woff2") format("woff2"), url("font/bopomofo.woff") format("woff");
		}

        /* 【修改標記】針對智慧型手機（直式直向螢幕）的專屬精細優化 */
        @media (max-width: 576px) {
            body {
                justify-content: flex-start; /* 手機頂部對齊 */
                padding: 8px;
            }
            h1 { font-size: 1.5rem !important; margin-bottom: 2px !important; }
            p.text-muted { font-size: 0.85rem !important; margin-bottom: 10px !important; }
            
            .game-card {
                padding: 15px !important;
                max-height: none; /* 手機允許自由向下延伸 */
            }
            .target-word-title {
                font-size: 2.2rem !important; /* 大幅縮小手機上「目標國字：」這五個字的霸道佔位 */
            }
            .option-btn {
                flex: 1 1 calc(25% - 8px); /* 手機上按鈕自動排成一列 4 個，並且撐滿，按鍵變大超好按 */
                min-width: 60px;
                height: 60px;
            }
            .d-flex.flex-wrap {
                gap: 8px !important; /* 縮小按鈕之間的間距，騰出更多空間 */
            }
        }

        /* 【修改標記】針對短螢幕裝置（例如 iPad 橫放、低解析度筆電螢幕）的專屬高度優化 */
        @media (max-height: 768px) and (min-width: 577px) {
            h1 { font-size: 1.8rem !important; margin-bottom: 2px !important; }
            p.text-muted { display: none; } /* 橫向空間寶貴，直接隱藏副標題提示語 */
            .target-word-title { font-size: 2.5rem !important; margin-bottom: 5px !important; }
            .word-display-box { mb-3 !important; }
            .game-card { padding: 20px !important; }
        }
    </style>
</head>
<body>
<div class="container-xl w-100">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-11 col-md-9 col-lg-7 text-center">
            
            <h1 class="fw-bold mb-1" style="color: var(--forest-green);">森林拆字守護者 🌳</h1>
            <p class="text-muted mb-2">點擊正確的部件，幫「字寶寶」找回它的零件吧！</p>

            <div class="card game-card p-3 p-sm-4 shadow">
                <div>
                    <div class="progress mb-2">
                        <div id="game-progress" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                    </div>
                    <div id="star-area" class="star-badge"></div>
                </div>

                <div class="mb-2 text-secondary fw-bold target-word-title" style="font-size: clamp(2.2rem, 6vh, 3.5rem);">
                    目標國字：<span id="current-full-word" class="text-dark">?</span>
                </div>

                <div class="word-display-box mb-3 shadow-sm" id="display-area"></div>
                
                <div id="message" class="mb-2 text-success"></div>

                <div class="d-flex flex-wrap justify-content-center gap-2 mb-3" id="options"></div>

                <div class="d-grid gap-2 col-10 col-sm-8 mx-auto">
                    <button id="submit-btn" class="btn btn-primary btn-lg shadow mb-1" onclick="submitAnswer()">
                        確定 🔍
                    </button>
                    <button id="next-btn" class="btn btn-success btn-lg shadow" onclick="nextLevel()" style="display: none;">
                        下一個關卡 ✨
                    </button>
                </div>
            </div>

            <p class="mt-2 mb-0 text-secondary small">本輪練習進度：<span id="progress-text">0</span>/<span id="progress-tot">0</span></p>
        </div>
    </div>
</div>

<div class="modal fade" id="resultModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content text-center" style="border-radius: 20px; border: none;">
            <div class="modal-header justify-content-center bg-success text-white" style="border-top-left-radius: 20px; border-top-right-radius: 20px;">
                <h4 class="modal-title fw-bold" id="resultModalLabel">🌳 本輪守護成果報告 🌳</h4>
            </div>
            <div class="modal-body p-4">
                <div class="mb-4">
                    <span class="text-secondary h5">您的守護成績</span>
                    <h1 class="display-4 fw-bold text-success mt-2" id="score-text">0 / 0</h1>
                </div>
                <hr>
                <h5 class="text-start fw-bold mb-3 text-secondary">📋 題目清單（錯誤優先排列）：</h5>
                <div class="list-group text-start shadow-sm" id="result-list">
                    </div>
            </div>
            <div class="modal-footer justify-content-center" style="border-top: none;">
                <button type="button" class="btn btn-success btn-lg px-5 shadow" onclick="location.reload()">再玩一次 🔄</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        let quizData = []; // 本輪抽選出的 20 題

        let sessionHistory = [];

		// 1. 初始化 IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("ForestWordDB", 1);
                
                request.onupgradeneeded = function(e) {
                    const dbInstance = e.target.result;
                    if (!dbInstance.objectStoreNames.contains("wordProgress")) {
                        dbInstance.createObjectStore("wordProgress", { keyPath: "word" });
                    }
                };

                request.onsuccess = function(e) {
                    db = e.target.result;
                    resolve();
                };

                request.onerror = function(e) {
                    console.error("IndexedDB 開啟失敗", e);
                    reject();
                };
            });
        }
		
		// 2. 取得某個字的答對次數
        function getWordCount(word) {
            return new Promise((resolve) => {
                const transaction = db.transaction(["wordProgress"], "readonly");
                const store = transaction.objectStore(["wordProgress"]);
                const request = store.get(word);
                request.onsuccess = function(e) {
                    if (e.target.result) {
                        resolve(e.target.result.count || 0);
                    } else {
                        resolve(0);
                    }
                };
                request.onerror = function() {
                    resolve(0);
                };
            });
        }

        // 3. 更新某個字的答對次數 (isCorrect為true則+1，最高5；false則清零)
        function updateWordCount(word, isCorrect) {
            return new Promise((resolve) => {
                const transaction = db.transaction(["wordProgress"], "readwrite");
                const store = transaction.objectStore(["wordProgress"]);
                const request = store.get(word);

                request.onsuccess = function(e) {
                    let data = e.target.result || { word: word, count: 0 };
                    if (isCorrect) {
                        data.count = Math.min(5, data.count + 1);
                    } else {
                        data.count = 0;
                    }
                    store.put(data);
                    resolve(data.count);
                };
            });
        }

        // 4. 加權抽選 20 個字建立當前輪次題庫
        async function generateQuizSession() {
            let listWithWeights = [];
            
            // 讀取所有字的目前次數並計算權重
            for (let item of rawQuizData) {
                const count = await getWordCount(item.word);
                let weight = 5; // 預設 0 次為 5
                if (count === 1) weight = 4;
                else if (count === 2) weight = 3;
                else if (count === 3) weight = 2;
                else if (count === 4) weight = 1;
                else if (count === 5) weight = 0.1; // 5次最低
                
                listWithWeights.push({ item: item, weight: weight });
            }

            // 根據加權比例隨機抽取 20 題
            let selected = [];
            const targetCount = Math.min(20, rawQuizData.length);

            while (selected.length < targetCount && listWithWeights.length > 0) {
                let totalWeight = listWithWeights.reduce((sum, el) => sum + el.weight, 0);
                let randomNum = Math.random() * totalWeight;
                let currentSum = 0;
                
                for (let i = 0; i < listWithWeights.length; i++) {
                    currentSum += listWithWeights[i].weight;
                    if (randomNum <= currentSum) {
                        selected.push(listWithWeights[i].item);
                        listWithWeights.splice(i, 1); // 避免重複抽取
                        break;
                    }
                }
            }

            quizData = selected;
            document.querySelector("#progress-tot").textContent = quizData.length;
			sessionHistory = []; // 重設紀錄
        }

		// 初始化關卡
        async function initLevel() {
            if (quizData.length === 0) return;
			
			isLevelAnswered = false;
            
		    document.querySelector("#progress-text").textContent = currentIdx + 1;
            const data = quizData[currentIdx];
            
            // 呈現星星進度
            const currentCount = await getWordCount(data.word);
            renderStars(currentCount);

			let full_word = data.vocab.map((v)=>{return '<ruby><span>'+v.text+'</span><rt>'+v.bopomo+'</rt>'+'</ruby>'}).join('').replace(data.word,'　');
            document.getElementById('current-full-word').innerHTML = full_word;
			
            document.getElementById('message').innerText = "";
            document.getElementById('next-btn').style.display = "none";
            document.getElementById('submit-btn').style.display = "inline-block";
            
            userAnswers = new Array(data.parts.length).fill("");
            renderSlots();
            
            // 產生選項
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = "";
            
            let allOptions = [...new Set(rawQuizData.flatMap((v)=>v.parts))];
			
			let tot_buttons = 12;
			
			const uniqueParts = [...new Set(data.parts)];
			let random_options = allOptions.filter(x => !uniqueParts.includes(x)).sort(() => Math.random() - 0.5).slice(0, tot_buttons - uniqueParts.length);
			let show_options = [...new Set([...random_options, ...uniqueParts])].sort(() => Math.random() - 0.5);
			

            show_options.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = p;
                btn.onclick = () => addPart(p);
                optionsDiv.appendChild(btn);
            });

            let progressPercent = (currentIdx / quizData.length) * 100;
            document.getElementById('game-progress').style.width = progressPercent + '%';
        }



// 渲染星星進度
        function renderStars(count) {
            const starArea = document.getElementById('star-area');
            let starsHTML = "";
            for (let i = 1; i <= 5; i++) {
                if (i <= count) {
                    starsHTML += "⭐";
                } else {
                    starsHTML += "★"; // 空心星
                }
            }
            starArea.innerHTML = starsHTML;
        }

        // 渲染格子
        function renderSlots() {
            const displayArea = document.getElementById('display-area');
            displayArea.innerHTML = "";

            userAnswers.forEach((part, index) => {
                const slot = document.createElement('div');
                if (part === "") {
                    slot.className = 'component-slot';
                    slot.innerText = "？";
                } else {
                    slot.className = 'component-slot filled';
                    slot.innerText = part;
                    slot.onclick = () => removePart(index);
                }
                displayArea.appendChild(slot);
            });
        }

        function addPart(p) {
		    if (isLevelAnswered) return; // 如果回答過了，禁止修改
            const emptyIndex = userAnswers.indexOf("");
            if (emptyIndex !== -1) {
                userAnswers[emptyIndex] = p;
                renderSlots();
                document.getElementById('message').innerText = "";
            }
        }

        function removePart(index) {
		    if (isLevelAnswered) return; // 如果回答過了，禁止修改
            userAnswers[index] = "";
            renderSlots();
            document.getElementById('message').innerText = "";
        }

        // 點擊「確定」：驗證答案
        async function submitAnswer() {
            const data = quizData[currentIdx];

            if (userAnswers.includes("")) {
                document.getElementById('message').innerText = "請先把格子都填滿再檢查喔！🌱";
                return;
            }
			
			isLevelAnswered = true; // 鎖定狀態，不可再增刪部件
			
			// 直接依據陣列位置進行嚴格的比對（順序必須相同）
            let isCorrect = true;
            for (let i = 0; i < data.parts.length; i++) {
                if (userAnswers[i] !== data.parts[i]) {
                    isCorrect = false;
                    break;
                }
            }
			
			// 無論對錯，皆切換按鈕，答錯顯示紅字且計次清零

                    return '<ruby>' + textSpan + '<rt>'+v.bopomo+'</rt>'+'</ruby>';
                }).join('');
                document.getElementById('current-full-word').innerHTML = reveal_word;

                // 更新 IndexedDB 進度次數 (+1)

                let progressPercent = ((currentIdx + 1) / quizData.length) * 100;

            } else {

                    return '<ruby>' + textSpan + '<rt>'+v.bopomo+'</rt>'+'</ruby>';

                renderStars(newCount);
            }
			
			// 新增：將本題結果推入當前挑戰歷史紀錄
            sessionHistory.push({
                word: data.word,
                parts: data.parts,
                isCorrect: isCorrect
            });
			
        }

		function nextLevel() {
            // 判斷是否已經完成了所有的題目 (例如 20 題)
            if (sessionHistory.length >= quizData.length) {
                showFinalResults();
                return;
            }

            currentIdx = (currentIdx + 1) % quizData.length;
            initLevel();
        }

		// 新增：生成並顯示結果 Modal
        function showFinalResults() {
            const totalQuestions = quizData.length;
            const correctCount = sessionHistory.filter(item => item.isCorrect).length;

            // 1. 填入得分資訊
            document.getElementById('score-text').innerText = `${correctCount} / ${totalQuestions}`;

            // 2. 將紀錄排序：錯誤的往前排 (false 代表 0，true 代表 1，0減1為負數，會排在前面)
            let sortedHistory = [...sessionHistory].sort((a, b) => a.isCorrect - b.isCorrect);

            // 3. 生成清單 HTML
            const resultListEl = document.getElementById('result-list');
            resultListEl.innerHTML = "";

            sortedHistory.forEach(item => {
                const listItem = document.createElement('div');
                // 根據對錯給予不同的背景提示
                listItem.className = `list-group-item d-flex justify-content-between align-items-center p-3 ${item.isCorrect ? 'list-group-item-success' : 'list-group-item-danger'}`;
                
                // 串接部件字串，格式如：部件1、部件2、...
                const partsString = item.parts.join('、');

				listItem.innerHTML = `
                    <div>
                        <span class="fs-3 fw-bold me-3 text-dark">${item.word}</span>
                        <span class="text-muted fs-4 result-parts">= ${partsString}</span>
                    </div>
                    <span class="badge ${item.isCorrect ? 'bg-success' : 'bg-danger'} rounded-pill fs-6">
                        ${item.isCorrect ? '✓ 正確' : '✗ 錯誤'}
                    </span>
                `;
                resultListEl.appendChild(listItem);
            });

            // 4. 顯示 Bootstrap Modal 視窗
            const resultModal = new bootstrap.Modal(document.getElementById('resultModal'));
            resultModal.show();
        }

        // 遊戲總啟動點
        async function startGame() {
            await initDB();              // 開啟資料庫
            await generateQuizSession(); // 加權抽取 20 題
            initLevel();                 // 載入第一關
        }

        startGame();
